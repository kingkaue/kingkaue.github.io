<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaue King - Gameplay Programmer Portfolio</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="navbar_container">
        <a href="/" id="navbar_logo">
          <img src="Images/logo.png" alt="Kaue King Logo" class="logo-image" />
        </a>
        <div class="navbar_toggle" id="mobile-menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <ul class="navbar_menu">
          <li class="navbar_item">
            <a href="index.html" class="navbar_links">Home</a>
          </li>
          <li class="navbar_item">
            <a href="about.html" class="navbar_links">About Me</a>
          </li>
          <li class="navbar_item">
            <a href="portfolio.html" class="navbar_links">Portfolio</a>
          </li>
          <li class="navbar_item">
            <a href="resume.html" class="navbar_links">Resume</a>
          </li>
          <li class="navbar_item">
            <a href="contact.html" class="navbar_links">Contact</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="page-hero">
      <div class="hero_content">
        <h1>Contact</h1>
        <p>Get in touch to discuss potential collaborations or opportunities</p>
      </div>
    </div>

    <div class="page-content">
      <section class="contact" id="contact">
        <div class="container">
            <div class="contact_content">
                <div class="contact_info">
                    <div class="contact_item">
                        <div class="contact_icon">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div>
                            <h3>Location</h3>
                            <p>Orlando, FL</p>
                        </div>
                    </div>
                    <div class="contact_item">
                        <div class="contact_icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div>
                            <h3>Email</h3>
                            <p>kaueking@gmail.com</p>
                        </div>
                    </div>
                    <div class="contact_item">
                        <div class="contact_icon">
                            <i class="fas fa-globe"></i>
                        </div>
                        <div>
                            <h3>LinkedIn</h3>
                            <p>www.linkedin.com</p>
                        </div>
                    </div>
                </div>
                <form class="contact_form">
                    <div class="form_group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" class="form_control" required>
                    </div>
                    <div class="form_group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" class="form_control" required>
                    </div>
                    <div class="form_group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" class="form_control" required>
                    </div>
                    <div class="form_group">
                        <label for="message">Your Message</label>
                        <textarea id="message" class="form_control" required></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>
    </section>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer_content">
        <div class="social_links">
          <a href="#" class="social_link"><i class="fab fa-linkedin-in"></i></a>
          <a href="#" class="social_link"><i class="fab fa-github"></i></a>
          <a href="#" class="social_link"><i class="fab fa-twitter"></i></a>
          <a href="#" class="social_link"><i class="fab fa-youtube"></i></a>
        </div>
        <p class="copyright">© 2023 Kaue King. All Rights Reserved.</p>
      </div>
    </footer>
  </body>
  <script src="app.js"></script>
</html>
